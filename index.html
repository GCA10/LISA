<title>Лиса · Vocabulari rus</title>
<style>

*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:radial-gradient(circle at 20% 0,#1d4a58,var(--bg) 60%);color:var(--ink);font:clamp(16px,.5vw + 13px,22px)/1.4 system-ui,sans-serif;padding-top:env(safe-area-inset-top)}

.path:before{content:"";position:absolute;top:13px;left:8px;right:8px;border-top:4px dashed var(--card)}

select{color-scheme:dark}h3{font-family:var(--ru);color:var(--amb);margin:18px 0 2px}

.fl{position:fixed;left:50%;top:40%;font:800 1.9em system-ui;color:var(--amb);pointer-events:none;animation:up 1.1s forwards;z-index:9;transform:translateX(-50%)}

.big{text-align:center;padding-top:30px}.big .fox{font-size:6em}

@media(max-width:480px){.path{margin-left:0;margin-right:0}.stop{font-size:.54em;letter-spacing:-.02em;white-space:nowrap;overflow-wrap:normal}.chips span{font-size:.62em}.chips button{padding:8px 0}}
@media(min-width:1000px) and (min-height:700px){#m{padding-top:5vh}}
@media(max-height:480px){.card{height:11em}.fox{font-size:2.5em}.big .fox{font-size:3.5em}}
#sn{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}#m{position:relative;z-index:1}nav{z-index:3}
#m>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}#m>*:nth-child(2){animation-delay:.07s}#m>*:nth-child(3){animation-delay:.14s}#m>*:nth-child(4){animation-delay:.21s}#m>*:nth-child(n+5){animation-delay:.28s}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}}
.hm,.tiles{display:grid;gap:1em}.tile{transition:.2s}.tile:hover{transform:translateY(-4px) rotate(-.6deg);filter:brightness(1.12)}.tile:hover em{animation:wg .5s}@keyframes wg{30%{transform:rotate(-14deg) scale(1.2)}70%{transform:rotate(12deg) scale(1.2)}}
.bar i{background-size:200% 100%;animation:shine 2.4s linear infinite}@keyframes shine{to{background-position:-200% 0}}
.stop.h b{animation:ring 1.6s infinite}@keyframes ring{from{box-shadow:0 0 0 0 #ffb54a99}to{box-shadow:0 0 0 14px #ffb54a00}}
.stop.d b:after{content:"✓";position:absolute;inset:0;font:700 .9em system-ui;color:#2b1a00;display:grid;place-items:center}
.pill i{display:inline-block;font-style:normal;animation:fl 1.2s ease-in-out infinite alternate}@keyframes fl{to{transform:scale(1.2) rotate(8deg)}}
.tg{position:absolute;top:10px;left:12px;background:#0b1b22;color:var(--amb);border-radius:10px;padding:2px 10px;font:700 .65em system-ui}
.face.sm{font-size:1.3em}.face.b.sm{font-size:1.1em}.face{overflow:auto}
.pt{position:fixed;pointer-events:none;z-index:20;font-size:1.4em;animation:pt 1s cubic-bezier(.1,.7,.4,1) forwards}@keyframes pt{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.ov{position:fixed;inset:0;z-index:30;background:#000a;display:grid;place-items:center;animation:rise .3s both}
.bx{background:var(--card);border:3px solid var(--amb);border-radius:28px;padding:2em 2.2em;text-align:center;max-width:22em;animation:pp .5s cubic-bezier(.3,1.6,.5,1)}@keyframes pp{from{transform:scale(.5);opacity:0}}
#m:has(.gx){max-width:44em}
@media(min-width:1000px){#m{max-width:min(92vw,72em)}#m:has(.gx){max-width:44em}.dash{grid-template-columns:1.6fr 1fr;align-items:start}.scene{height:clamp(20em,52vh,34em)}#ls{columns:2;column-gap:2em}#ls h3,#ls .row{break-inside:avoid}}
@media(min-width:1500px){#ls{columns:3}}
body{background:linear-gradient(125deg,#0d2530,#173b57,#2a1d52,#0d2530);background-size:300% 300%;animation:bg 26s ease infinite}@keyframes bg{50%{background-position:100% 50%}}
select option{background:#0b1b22;color:#eef5f3}
h1.lg{background:linear-gradient(90deg,var(--amb),var(--red),var(--amb));background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite}
.dash{display:grid;gap:1.2em}.panel{background:#1b3b47aa;backdrop-filter:blur(8px);border-radius:24px;padding:1em 1.2em;border:2px solid #ffffff14}.panel select{margin-bottom:.4em}
.say{margin-top:1em;background:#1b3b47cc}.say .fox{font-size:3em}.say small{display:block;margin-top:.4em}.say .bar{margin:.7em 0 0}
.scene{position:relative;height:clamp(18em,40vh,28em);border-radius:28px;overflow:hidden;background:linear-gradient(var(--s1),var(--s2));border:2px solid #ffffff2a;box-shadow:0 14px 40px #0008}
.stars{position:absolute;inset:0;background:radial-gradient(1.5px 1.5px at 20% 30%,#fff,#0000),radial-gradient(1.5px 1.5px at 70% 18%,#fff,#0000),radial-gradient(2px 2px at 45% 50%,#fff,#0000),radial-gradient(1.5px 1.5px at 88% 55%,#fff,#0000),radial-gradient(1.5px 1.5px at 8% 60%,#fff,#0000);animation:tw 3s infinite alternate}@keyframes tw{to{opacity:.25}}
.cl{position:absolute;left:-10%;font-size:2.4em;opacity:.5;animation:dr var(--d) linear infinite;animation-delay:var(--o,0s)}@keyframes dr{to{left:110%}}
.hill{position:absolute;left:-15%;right:-15%;bottom:-7em;height:12em;border-radius:50%;background:#0f3040}.hill.b{bottom:-9.5em;background:#0a1f2a;transform:translateX(18%)}
.pth{position:absolute;left:0;right:0;bottom:.8em;display:flex;z-index:1}
.stp{width:20%;text-align:center;font-size:.72em;color:#fff;text-shadow:0 1px 4px #000a}
.stp em{display:block;font-style:normal;font-size:2.6em;filter:grayscale(1) opacity(.45);transition:.6s}.stp.d em,.stp.h em{filter:none}.stp.h em{animation:bob 2.4s ease-in-out infinite}
.stp b{display:block;position:relative;width:1.4em;height:1.4em;border-radius:50%;background:#ffffff33;border:3px solid #fff9;margin:.3em auto}
.stp.d b,.stp.h b{background:var(--amb)}.stp.h b{animation:ring 1.6s infinite}.stp.d b:after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;font:700 .9em system-ui;color:#2b1a00}
.hero{position:absolute;bottom:1.3em;font-size:3.2em;transform:translateX(-50%);transition:left 1.8s cubic-bezier(.4,1.2,.5,1);animation:hb .8s ease-in-out infinite alternate;z-index:2;filter:drop-shadow(0 6px 6px #0006)}@keyframes hb{to{margin-bottom:.25em}}
.sw{position:absolute;top:.7em;left:.7em;display:flex;gap:.4em;z-index:3}.sw button{width:2.5em;height:2.5em;border-radius:50%;border:2px solid #fff3;background:#0007;font-size:1.2em;padding:0;transition:.2s}.sw .on{border-color:var(--amb);transform:scale(1.15)}
.ttl{position:absolute;top:.9em;right:1em;color:#fff;font:italic 700 1.2em var(--ru);text-shadow:0 2px 8px #000a;z-index:3}
.tile{border:0;box-shadow:0 6px 18px #0005}.tile.g1{background:linear-gradient(135deg,#ff9f1c,#ff5d73);animation:pls 2.4s infinite}.tile.g2{background:linear-gradient(135deg,#2ec4b6,#3a86ff)}.tile.g3{background:linear-gradient(135deg,#9b5de5,#f15bb5)}
.tile b,.tile span{color:#fff;text-shadow:0 1px 3px #0004}.tile em{filter:drop-shadow(0 3px 4px #0005)}@keyframes pls{50%{box-shadow:0 0 0 7px #ffb54a44,0 6px 18px #0005}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(7em,1fr));gap:10px}.stats div{background:var(--card);border-radius:18px;padding:1em;text-align:center;font-size:.8em;color:var(--mut)}.stats b{display:block;font-size:2.2em;color:var(--ink)}
.prow{display:grid;grid-template-columns:9em 1fr 3.5em;align-items:center;gap:10px;margin:8px 0}.prow .bar{margin:0}.prow small{color:var(--mut)}
@media(max-width:480px){.stp{font-size:.56em;white-space:nowrap}.hero{font-size:2.6em;bottom:1.6em}.prow{grid-template-columns:7em 1fr 3em}}
.mk{font:600 1.4em var(--ru);letter-spacing:.1em;text-align:center;word-break:break-word;margin:.4em 0}.hint{text-align:center;margin:.4em 0}.hs{font-size:.9em}
.mh{display:grid;grid-template-columns:1fr 1fr;gap:10px;color:var(--mut);font:700 .75em system-ui;letter-spacing:.12em;text-transform:uppercase;margin:.6em 0 .3em}.mh span{padding-left:.4em}
.cols>div{display:flex;flex-direction:column;gap:10px}.cols button{min-height:3.6em;margin:0;width:100%;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.2;border-radius:16px;box-shadow:0 4px 0 #0b1b22}
.cols .r{border-color:#ffb54a55;font-style:italic}.cols .e{border-color:#5be0b055;font:600 1em system-ui}
.cols .s{border-color:var(--amb);background:#4b4a2a;transform:scale(1.04);box-shadow:0 0 0 4px #ffb54a55}
.cols .o{opacity:1!important;pointer-events:none;background:hsl(var(--h) 55% 26%);border-color:hsl(var(--h) 75% 58%);box-shadow:0 0 14px hsl(var(--h) 75% 50%/.5);transform:scale(.97)}.cols .o:after{content:" ✓"}
.cols .bad2{animation:sh .4s;border-color:var(--red)!important;background:#5a2030!important}
@media(min-width:1000px) and (min-height:620px){#m:has(.dash){display:flex;flex-direction:column;height:100vh;padding:20px 32px}#m:has(.dash) .dash{flex:1;min-height:0;align-items:stretch}.dash>div:first-child{display:flex;flex-direction:column;min-height:0}.dash .scene{flex:1;height:auto;min-height:18em}.panel{display:flex;flex-direction:column}.panel .tiles{flex:1;grid-template-rows:repeat(3,1fr)}.tile{padding:1em 1.4em}.tile em{font-size:3em}.tile b{font-size:1.2em}}
</style></head><body><canvas id=sn></canvas><div id="m"></div>
<nav><button id="n0" onclick="go(0)"><span>🏠</span>Inici</button><button id="n1" onclick="go(1)"><span>📖</span>Paraules</button><button id="n2" onclick="go(2)"><span>🏆</span>Progrés</button></nav>
<script>
const $=s=>document.querySelector(s),K='lisa_v1',DAY=864e5;
const STORIES=[
{c:'🦊',t:'Transsiberià',s:["Калининград","Москва","Казань","Байкал","Владивосток"],l:["La Lisa ha perdut el bitllet a Kaliningrad. El revisor només parla rus. Ajuda-la a sortir de l’estació!","Moscou! El metro és un laberint. Cada paraula nova il·lumina un passadís.","A Kazan, el mercat és ple de regateig. Necessita expressions de debò.","El tren creua Sibèria. Amb el Baikal gelat, només et salva un bon vocabulari.","Vladivostok és a l’horitzó. Un últim esforç, Lisa!"]},
{c:'🧙🏻‍♀️',t:'Baba-Iagà',s:["Бор","Изба","Река","Кощей","Дом"],l:["La Vasilisa entra al bosc fosc amb una nina màgica a la butxaca. La Baba-Iagà vol saber quant rus saps abans de deixar-la passar.","La cabana gira sobre potes de gallina. Només s’obre si dius la paraula correcta.","Per creuar el riu cal respondre bé tres endevinalles.","Al palau de Kosxei l’Immortal, una paraula errada i les portes es tanquen.","Ja es veu la llum de casa. Una última prova i la Vasilisa és lliure!"]},
{c:'🧑🏻‍🚀',t:'Gagarin',s:["Клушино","Звёздный","Байконур","Орбита","Земля"],l:["Iuri Gagarin va néixer en un poble prop de Smolensk. Cada paraula que aprens t’acosta una mica més a l’espai.","A la Ciutat de les Estrelles t’entrenes fins que les paraules surten soles.","Baikonur, 12 d’abril de 1961. El compte enrere és en rus: cada paraula compta.","En òrbita! Els controladors parlen ràpid. Mantén el ritme.","Aterratge! «Поехали!» va ser el crit d’inici; ara el vocabulari ja és teu."]}];
let S=load(),Q=[],n=0,V=0,sel=null,left=0,LG,H=0,GM=0;
function mk(r,e,t){return{id:Math.random().toString(36).slice(2),ru:r,es:e,n:t||'',e:2.5,i:0,d:0}}
function load(){try{const s=JSON.parse(localStorage.getItem(K));if(s){s.x=s.x||[];s.px=s.px||[s.xp,0,0];s.cur=s.cur||0;return s}}catch(e){}return{w:[],x:[],xp:0,st:0,day:'',px:[0,0,0],cur:0}}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.normalize('NFD').replace(/\u0301/g,'').normalize('NFC').toLowerCase().replace(/ё/g,'е').trim();
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const say=t=>{try{const u=new SpeechSynthesisUtterance(t);u.lang='ru-RU';speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}};
function pop(t){const d=document.createElement('div');d.className='fl';d.textContent=t;if(t.length>8)d.style.cssText='font-size:1.05em;background:var(--card);padding:8px 16px;border-radius:14px;white-space:nowrap';document.body.appendChild(d);setTimeout(()=>d.remove(),1100)}
const lv=()=>Math.min(4,S.px[S.cur]/150|0);
function gain(x){const L0=lv();S.xp+=x;S.px[S.cur]+=x;const t=new Date().toDateString();if(S.day!==t){S.st=S.day===new Date(Date.now()-DAY).toDateString()?S.st+1:1;S.day=t}save();pop('+'+x+' ✨');if(lv()>L0)setTimeout(up,500)}
function grade(w,k){if(k==0){w.i=0;w.e=Math.max(1.3,w.e-.2);w.d=Date.now()+6e5}else if(k==1){w.i=Math.max(1,Math.round(w.i*1.2));w.d=Date.now()+w.i*DAY}else{w.i=w.i==0?1:w.i==1?3:Math.round(w.i*w.e);w.e+=.05;w.d=Date.now()+w.i*DAY}save()}
const due=()=>P().filter(w=>w.d<=Date.now());
function main(h){$('#m').innerHTML=h;scrollTo(0,0)}
function go(v){V=v;GM=0;[0,1,2].forEach(i=>$('#n'+i).className=i==v?'on':'');[home,words,prog][v]()}
const LAND=[['🚉','🏛️','🕌','🏔️','🌉'],['🌲','🛖','🌊','🏰','🏡'],['🏘️','🏋️','🚀','🛰️','🌍']],SKY=[['#25456f','#e2825a'],['#1b0f45','#7a3a9a'],['#040a2a','#1c3f9a']];
function pl(t){return /ió$/.test(t)?t.slice(0,-2)+'ions':/s$/.test(t)?t:t+'s'}
function home(){const T=STORIES[S.cur],px=S.px[S.cur],L=lv(),k=SKY[S.cur],nx=L<4?`${150-px%150} XP per arribar a ${T.s[L+1]}`:'Història completada! 🎉';
main(`<div class=top><h1 class=lg>Лиса</h1><span><button class=pill style="border:0;color:inherit;font:inherit;margin-right:6px" onclick="S.mu=!S.mu;save();home()">${S.mu?'🔇':'🔊'}</button><span class=pill><i>🔥</i> ${S.st} · ✨ ${S.xp}</span></span></div>
<div class=dash><div><div class=scene style="--s1:${k[0]};--s2:${k[1]}"><div class=stars></div><div class=cl style="top:16%;--d:42s">☁️</div><div class=cl style="top:34%;--d:64s;--o:-25s">☁️</div>
<div class=sw>${STORIES.map((t,i)=>`<button class="${i==S.cur?'on':''}" title="${t.t}" onclick="S.cur=${i};save();home()">${t.c}</button>`).join('')}</div><b class=ttl>${T.t}</b>
<div class=hill></div><div class="hill b"></div>
<div class=pth>${T.s.map((s,i)=>`<div class="stp ${i<L?'d':''} ${i==L?'h':''}"><em>${LAND[S.cur][i]}</em><b></b>${s}</div>`).join('')}</div>
<div class=hero id=hr style="left:-8%">${T.c}</div></div>
<div class=say><span class=fox>${T.c}</span><div>${T.l[L]}<div class=bar><i style="width:${L==4?100:px%150/1.5}%"></i></div><small class=mut>${nx}</small></div></div></div>
<div class=panel><h2>Jocs <small class=mut>· ${SW().length} paraules</small></h2><select onchange="S.f=this.value;save();home()"><option value="">Tot el vocabulari</option>${TY(SW()).map(t=>`<option value="${esc(t)}" ${t==S.f?'selected':''}>${esc(pl(t))}</option>`).join('')}</select>
<div class=tiles><button class="tile g1" onclick=cards()><em>🃏</em><div><b>Targetes</b><span>Repàs intel·ligent · ${due().length} per repassar</span></div></button>
<button class="tile g2" onclick=typ()><em>⌨️</em><div><b>Escriu-ho en rus</b><span>Veus el català, escrius el rus</span></div></button>
<button class="tile g3" onclick=mat()><em>🔗</em><div><b>Emparella</b><span>Uneix cada paraula amb el seu significat</span></div></button></div></div></div>`);
setTimeout(()=>{const h=$('#hr');if(h)h.style.left=(10+L*20)+'%'},120)}
function prog(){const m=S.w.filter(w=>w.i>=7).length,l=S.w.filter(w=>w.i>0&&w.i<7).length;
main(`<h2>El teu progrés</h2><div class=stats><div><b>${S.w.length}</b>paraules</div><div><b>${m}</b>dominades</div><div><b>${l}</b>en curs</div><div><b>${S.st}</b>🔥 dies</div><div><b>${S.xp}</b>✨ XP</div></div>
<h3>Per tipus</h3>${TY().map(t=>{const a=S.w.filter(w=>ty(w)==t),d=a.filter(w=>w.i>=7).length;return `<div class=prow><span>${esc(pl(t))}</span><div class=bar><i style="width:${d/a.length*100}%"></i></div><small>${d}/${a.length}</small></div>`}).join('')}
<h3>Històries</h3>${STORIES.map((t,i)=>`<div class=prow><span>${t.c} ${t.t}</span><div class=bar><i style="width:${Math.min(100,S.px[i]/6)}%"></i></div><small>${Math.min(4,S.px[i]/150|0)+1}/5</small></div>`).join('')}
`)}
function pick(k){if(P().length<2){main('<p class=big>Calen almenys 2 paraules d’aquest tipus al paraules.csv.</p>');return false}return k}
(function(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const c=$('#sn'),x=c.getContext('2d'),F=[];let W,H;const rs=()=>{W=c.width=innerWidth;H=c.height=innerHeight};rs();addEventListener('resize',rs);
for(let i=0;i<55;i++)F.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2.2+.6,v:Math.random()*.5+.2,s:Math.random()*6});
(function f(t){x.clearRect(0,0,W,H);x.fillStyle='#fff';F.forEach(p=>{p.y+=p.v;p.x+=Math.sin(t/1500+p.s)*.3;if(p.y>H){p.y=-5;p.x=Math.random()*W}x.globalAlpha=.12+p.r/7;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()});requestAnimationFrame(f)})(0)})();
function burst(el){const r=el?el.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0,height:0},E=['✨','🎉','⭐','❄️','🦊','💫'];
for(let i=0;i<16;i++){const d=document.createElement('span'),a=Math.random()*6.28,s=80+Math.random()*150;d.className='pt';d.textContent=E[Math.random()*6|0];d.style.cssText=`left:${r.left+r.width/2}px;top:${r.top+r.height/2}px;--x:${Math.cos(a)*s}px;--y:${Math.sin(a)*s-60}px;--r:${Math.random()*360}deg`;document.body.appendChild(d);setTimeout(()=>d.remove(),1000)}}
let AC;function snd(k){if(S.mu)return;try{AC=AC||new AudioContext();const t=AC.currentTime;(k=='ok'?[660,880]:k=='bad'?[200,150]:[523,659,784,1047]).forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=k=='bad'?'sawtooth':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.1,t+i*.1);g.gain.exponentialRampToValueAtTime(.001,t+i*.1+.25);o.connect(g);g.connect(AC.destination);o.start(t+i*.1);o.stop(t+i*.1+.26)})}catch(e){}}
function up(){const T=STORIES[S.cur],o=document.createElement('div');o.className='ov';o.onclick=()=>o.remove();o.innerHTML=`<div class=bx><div class=fox>${T.c}</div><h2>Nova parada!</h2><h1>${T.s[lv()]}</h1><p class=mut>Toca per continuar</p></div>`;document.body.appendChild(o);snd('win');burst(o.firstChild)}
const pn=s=>norm(s).replace(/\(а\)|[.,…!?;:()«»"'—–]/g,'').replace(/\s+/g,' ').trim();
function done(){main(`<div class="big gx"><div class=fox>${STORIES[S.cur].c}</div><h1>Молодец!</h1><p class=mut>Ronda completada: ${Q.length} paraules.</p><button class=btn onclick="LG()">Una altra ronda</button><button class="btn s" onclick="go(0)">Torna a l’inici</button></div>`);snd('win');burst()}
function cards(){LG=cards;GM=1;if(!pick(1))return;let q=due();Q=shuf(q.length?q:P().slice()).slice(0,10);n=0;cstep()}
function cstep(){if(n>=Q.length)return done();const w=Q[n];
main(`<i class=gx></i><div class=bar><i style="width:${n/Q.length*100}%"></i></div><div class=card id=c onclick="this.classList.add('f');$('#r').style.visibility='visible'"><div class=in>
<div class="face ${w.ru.length>26?'sm':''}"><span class=tg>${esc(ty(w))}</span>${esc(w.ru)}<button class=sp onclick="event.stopPropagation();say(Q[n].ru)">🔊</button></div>
<div class="face b ${w.es.length>40?'sm':''}">${esc(w.es)}<small>${esc(w.n)}</small></div></div></div>
<div class="g3" id=r style="visibility:hidden"><button class="btn s" onclick=rate(0)>😵 Fallat</button><button class="btn s" onclick=rate(1)>🤔 Dubtós</button><button class=btn onclick=rate(2)>😎 Sabut</button></div>`)}
function rate(k){grade(Q[n],k);gain([2,5,10][k]);if(k==2)burst($('#c'));snd(k?'ok':'bad');n++;cstep()}
function typ(){LG=typ;GM=1;if(!pick(1))return;Q=shuf(P().slice()).slice(0,10);n=0;tstep()}
function msk(r,h){return r.split(' ').map(t=>{const L=[...t].filter(c=>/[а-яё]/i.test(c)).length,k=h?Math.max(1,Math.round(L*[0,.25,.5,.75][h])):0;let i=0;return[...t].map(c=>/[а-яё]/i.test(c)?(i++<k?c:'_'):c).join('')}).join('  ')}
function tstep(){if(n>=Q.length)return done();H=0;const w=Q[n];
main(`<i class=gx></i><div class=bar><i style="width:${n/Q.length*100}%"></i></div><div class=prompt>${esc(w.es)}</div>
<div class=hint><span class=tg style="position:static">${esc(ty(w))}</span><div id=mk class=mk>${esc(msk(w.ru,0))}</div></div>
<input id=a autocomplete=off autocapitalize=off spellcheck=false lang=ru onkeydown="event.key=='Enter'&&chk()">
<div class=g3 style="grid-template-columns:1fr 2fr"><button class="btn s" id=hb onclick=hint()>💡 Pista</button><button class=btn onclick=chk()>Comprova</button></div>
<p class=mut style="text-align:center;font-size:.8em">Cada pista resta 3 XP · 3 pistes màxim</p><div id=fb class=prompt></div>`);$('#a').focus()}
function hint(){const a=$('#a');if(H>=3||a.disabled)return;H++;$('#mk').textContent=msk(Q[n].ru,H);$('#hb').textContent=H>=3?'💡 Sense més pistes':'💡 Pista '+H+'/3';a.focus()}
function chk(){const w=Q[n],a=$('#a');if(a.disabled)return;a.disabled=true;const A=pn(a.value),ok=A==pn(w.ru)||w.ru.split(/\s*\/\s*/).some(x=>pn(x)==A);grade(w,ok?(H<2?2:1):0);snd(ok?'ok':'bad');
if(ok){gain(Math.max(2,10-3*H));burst(a);say(w.ru);$('#fb').innerHTML='<span class=ok>✅ Правильно!</span>'}else{a.classList.add('shake');$('#fb').innerHTML='<span class=bad>'+esc(w.ru)+'</span>'}
setTimeout(()=>{n++;tstep()},ok?900:2200)}
function mat(){LG=mat;GM=1;if(!pick(1))return;Q=shuf(P().slice()).slice(0,10);n=0;mpage()}
function mpage(){const p=Q.slice(n,n+5);if(!p.length)return done();left=p.length;sel=null;
const b=(w,k,t)=>`<button class="${k}" data-i="${w.id}" data-k="${k}" onclick=tap(this)>${esc(t)}</button>`;
main(`<i class=gx></i><div class=bar><i style="width:${n/Q.length*100}%"></i></div><h2>Emparella <small class=mut>${Math.min(n+5,Q.length)}/${Q.length}</small></h2>
<div class=mh><span>Rus</span><span>Català</span></div><div class=cols><div>${shuf(p.slice()).map(w=>b(w,'r',w.ru)).join('')}</div><div>${shuf(p.slice()).map(w=>b(w,'e',w.es)).join('')}</div></div>`)}
function tap(b){if(!sel){sel=b;b.classList.add('s');return}
if(sel.dataset.k==b.dataset.k){sel.classList.remove('s');sel=b;b.classList.add('s');return}
if(sel.dataset.i==b.dataset.i){const h=(5-left)*65;[sel,b].forEach(x=>{x.classList.remove('s');x.classList.add('o');x.style.setProperty('--h',h)});grade(Q.find(w=>w.id==b.dataset.i),2);gain(5);snd('ok');burst(b);sel=null;if(--left==0){n+=5;setTimeout(mpage,900)}}
else{snd('bad');[sel,b].forEach(x=>{x.classList.add('bad2');setTimeout(()=>x.classList.remove('bad2','s'),450)});sel=null}}
function ty(w){return w.t||'Sense tipus'}
function ci(a){const o=['verb','connector','expressi','adjectiu','substantiu','adverbi','preposici'],i=o.findIndex(x=>norm(a).startsWith(x));return a=='Sense tipus'?100:i<0?50:i}
function cmp(a,b){return ci(a)-ci(b)||a.localeCompare(b,'ca')}
function TY(a){return[...new Set((a||S.w).map(ty))].sort(cmp)}
function SW(){return S.w.filter(w=>(w.h|0)==S.cur)}
function P(){const a=SW();return S.f&&a.some(w=>ty(w)==S.f)?a.filter(w=>ty(w)==S.f):a}
function words(){main(`<h2>Vocabulari (${S.w.length})</h2>
<select id=tf onchange=lst()><option value="">Tots els tipus</option>${TY().map(t=>`<option value="${esc(t)}">${esc(pl(t))}</option>`).join('')}</select>
<input id=q placeholder="Cerca en rus o català" oninput=lst()><div id=ls></div>`);lst()}
function lst(){const q=norm($('#q').value),f=$('#tf').value,g={};
S.w.filter(w=>(!f||ty(w)==f)&&(!q||norm(w.ru).includes(q)||norm(w.es).includes(q))).forEach(w=>(g[ty(w)]=g[ty(w)]||[]).push(w));
$('#ls').innerHTML=Object.keys(g).sort(cmp).map(k=>`<h3>${esc(pl(k))} <span class=mut>${g[k].length}</span></h3>`+g[k].slice(0,40).map(w=>`<div class=row><div><span class=hs>${STORIES[w.h|0].c}</span> <b style="font-family:var(--ru);font-size:1.15em">${esc(w.ru)}</b><div class=mut>${esc(w.es)}${w.n?' · '+esc(w.n):''}</div></div></div>`).join('')+(g[k].length>40?`<p class=mut>+${g[k].length-40} més. Afina la cerca.</p>`:'')).join('')}
function csv(t){const h=t.split(/\r?\n/)[0],d=h.includes(';')?';':h.includes('\t')?'\t':',',R=[];let r=[],f='',q=0;t=t.replace(/^\uFEFF/,'');
for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=0}else f+=c}
else if(c=='"')q=1;else if(c==d){r.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);R.push(r);r=[];f=''}else f+=c}
r.push(f);R.push(r);return R.map(r=>r.map(x=>x.trim()))}
function sync(t){const rows=csv(t).filter((p,i)=>p.length>=2&&p[0]&&p[1]&&!(i==0&&/^(paraula|rus)/.test(norm(p[0]))));
if(!rows.length)return 0;const m=new Map(S.w.map(w=>[norm(w.ru),w])),keep=new Set();let c=0;
rows.forEach((p,j)=>{const k=norm(p[0]),t=p[3]?p[3][0].toUpperCase()+p[3].slice(1).toLowerCase():'',q=STORIES.findIndex((x,i)=>norm(x.t)==norm(p[4]||'')||p[4]==String(i+1)),h=q<0?j%3:q,w=m.get(k);keep.add(k);
if(w){if(w.es!=p[1]||w.n!=(p[2]||'')||w.t!=t||w.h!==h){w.es=p[1];w.n=p[2]||'';w.t=t;w.h=h;c++}}else{const x=mk(p[0],p[1],p[2]);x.t=t;x.h=h;S.w.push(x);m.set(k,x);c++}});
const b=S.w.length;S.w=S.w.filter(w=>keep.has(norm(w.ru)));return c+b-S.w.length}
const DECK_URL='';
function deck(){fetch(DECK_URL||'paraules.csv',{cache:'no-cache'}).then(r=>r.ok?r.text():'').then(t=>{if(!t||t.trim().startsWith('<'))return;const c=sync(t);if(c){save();pop('Vocabulari actualitzat');if(!GM)go(V)}}).catch(()=>{})}
try{navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)deck()});
go(0);deck();
</script></body></html>
